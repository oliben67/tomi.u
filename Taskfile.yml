# https://taskfile.dev
version: "3"

includes:
  tomc:
    taskfile: tomc/Taskfile.yml
    dir: tomc
  vscode:
    taskfile: vscode-extensions/Taskfile.yml
    dir: vscode-extensions

tasks:
  # ─────────────────────────────────────────────────────────────────
  # Default
  # ─────────────────────────────────────────────────────────────────

  default:
    desc: "Run lint, build, and test (tomc)"
    cmds:
      - task: tomc:lint
      - task: tomc:build
      - task: tomc:test

  # ─────────────────────────────────────────────────────────────────
  # Aggregated targets
  # ─────────────────────────────────────────────────────────────────

  build:all:
    desc: "Build tomc and all VS Code extensions"
    cmds:
      - task: tomc:build
      - task: vscode:build

  # ─────────────────────────────────────────────────────────────────
  # CI (mirrors the GitHub Actions workflow)
  # ─────────────────────────────────────────────────────────────────

  ci:
    desc: "Run the full CI pipeline locally (lint → build → test → vscode)"
    cmds:
      - task: tomc:lint
      - task: tomc:build:debug
      - task: tomc:test
      - task: vscode:build
      - task: vscode:package
