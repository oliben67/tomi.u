# https://taskfile.dev
version: "3"

vars:
  TOOLCHAIN: "+nightly"
  IMAGE_NAME: "tomi-u/tomc"
  IMAGE_TAG: "latest"
  # Shared source globs
  RUST_SOURCES: "src/**/*.rs"
  RUST_TESTS: "tests/**/*.rs"
  CARGO_MANIFEST: "Cargo.toml"

tasks:
  # ─────────────────────────────────────────────────────────────────
  # Default
  # ─────────────────────────────────────────────────────────────────

  default:
    desc: "Run lint, build, and test"
    cmds:
      - task: lint
      - task: build
      - task: test

  # ─────────────────────────────────────────────────────────────────
  # Build
  # ─────────────────────────────────────────────────────────────────

  build:
    desc: "Compile tomc (release)"
    sources:
      - "{{.RUST_SOURCES}}"
      - "{{.CARGO_MANIFEST}}"
      - Cargo.lock
    generates:
      - target/release/tomc
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} build --all-targets --release

  build:debug:
    desc: "Compile tomc (debug)"
    sources:
      - "{{.RUST_SOURCES}}"
      - "{{.CARGO_MANIFEST}}"
      - Cargo.lock
    generates:
      - target/debug/tomc
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} build --all-targets

  # ─────────────────────────────────────────────────────────────────
  # Linting
  # ─────────────────────────────────────────────────────────────────

  lint:
    desc: "Run all linters (fmt check + clippy)"
    cmds:
      - task: lint:fmt
      - task: lint:clippy

  lint:fmt:
    desc: "Check code formatting with rustfmt"
    sources:
      - "{{.RUST_SOURCES}}"
      - "{{.RUST_TESTS}}"
      - rustfmt.toml
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} fmt --check

  lint:clippy:
    desc: "Run Clippy with warnings as errors"
    sources:
      - "{{.RUST_SOURCES}}"
      - "{{.RUST_TESTS}}"
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} clippy --all-targets --all-features -- -D warnings

  lint:fix:
    desc: "Auto-fix formatting and clippy warnings"
    cmds:
      - cargo {{.TOOLCHAIN}} fmt
      - cargo {{.TOOLCHAIN}} clippy --fix --allow-dirty --allow-staged -- -D warnings

  # ─────────────────────────────────────────────────────────────────
  # Testing
  # ─────────────────────────────────────────────────────────────────

  test:
    desc: "Run all tests"
    sources:
      - "{{.RUST_SOURCES}}"
      - "{{.RUST_TESTS}}"
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --all-targets

  test:lib:
    desc: "Run library unit tests only"
    sources:
      - "{{.RUST_SOURCES}}"
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --lib

  test:integration:
    desc: "Run integration tests only"
    sources:
      - "{{.RUST_SOURCES}}"
      - tests/integration_tests.rs
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --test integration_tests

  test:e2e:
    desc: "Run end-to-end tests only"
    sources:
      - "{{.RUST_SOURCES}}"
      - tests/end2end/**/*.rs
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --test end2end

  test:codegen:
    desc: "Run codegen tests (Rust + Python)"
    sources:
      - "{{.RUST_SOURCES}}"
      - tests/codegen_tests.rs
      - tests/python_codegen_tests.rs
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --test codegen_tests
      - cargo {{.TOOLCHAIN}} test --test python_codegen_tests

  test:lexer:
    desc: "Run lexer tests only"
    sources:
      - src/lexer/**/*.rs
      - tests/lexer_tests.rs
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --test lexer_tests

  test:parser:
    desc: "Run parser tests only"
    sources:
      - src/parser/**/*.rs
      - src/lexer/**/*.rs
      - src/ast/**/*.rs
      - tests/parser_tests.rs
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --test parser_tests

  test:types:
    desc: "Run type system tests only"
    sources:
      - src/types/**/*.rs
      - src/checker/**/*.rs
      - tests/type_tests.rs
      - "{{.CARGO_MANIFEST}}"
    method: checksum
    cmds:
      - cargo {{.TOOLCHAIN}} test --test type_tests

  # ─────────────────────────────────────────────────────────────────
  # Debug
  # ─────────────────────────────────────────────────────────────────

  debug:run:
    desc: "Build debug and run tomc with the given CLI_ARGS"
    cmds:
      - cargo {{.TOOLCHAIN}} run -- {{.CLI_ARGS | default ""}}

  debug:hello:
    desc: "Compile examples/tomc/hello.tomi to Rust and run it"
    cmds:
      - cargo {{.TOOLCHAIN}} run -- ../examples/tomc/hello.tomi --emit bin --verbose

  debug:hello:python:
    desc: "Compile examples/tomc/hello.tomi to Python and run it"
    cmds:
      - cargo {{.TOOLCHAIN}} run -- ../examples/tomc/hello.tomi --target python --emit bin --verbose

  # ─────────────────────────────────────────────────────────────────
  # Containerization
  # ─────────────────────────────────────────────────────────────────

  container:build:
    desc: "Build the tomc Docker image"
    cmds:
      - docker build -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} -f Dockerfile .

  container:run:
    desc: "Run tomc inside a container with the given CLI_ARGS"
    cmds:
      - docker run --rm -v "$PWD":/work -w /work {{.IMAGE_NAME}}:{{.IMAGE_TAG}} {{.CLI_ARGS | default ""}}

  container:push:
    desc: "Push the tomc image to the registry"
    cmds:
      - docker push {{.IMAGE_NAME}}:{{.IMAGE_TAG}}
