<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- High-resolution Stylized Stork Icon for Tomi Language -->
  <defs>
    <linearGradient id="bodyGradLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5BA0F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beakGradLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wingGradLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle (subtle) -->
  <circle cx="32" cy="32" r="30" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Stork Body (scaled 4x from 16px version) -->
  <ellipse cx="32" cy="36" rx="12" ry="18" fill="url(#bodyGradLarge)" stroke="#2980B9" stroke-width="0.5"/>
  
  <!-- Stork Neck (scaled 4x) -->
  <path d="M32 20 Q36 12 44 10" stroke="url(#bodyGradLarge)" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Stork Head (scaled 4x) -->
  <circle cx="46" cy="10" r="4.8" fill="url(#bodyGradLarge)" stroke="#2980B9" stroke-width="0.5"/>
  
  <!-- Stork Beak (scaled 4x) -->
  <path d="M50 10 L60 8.8 L60 11.2 Z" fill="url(#beakGradLarge)" stroke="#D35400" stroke-width="0.5"/>
  
  <!-- Stork Legs (scaled 4x) -->
  <line x1="28" y1="52" x2="26" y2="60" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="52" x2="38" y2="60" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Wing Detail (scaled 4x) -->
  <path d="M24 32 Q16 36 20 44" stroke="url(#wingGradLarge)" stroke-width="4" fill="none"/>
  
  <!-- Eye (scaled 4x) -->
  <circle cx="46" cy="8.8" r="1.2" fill="white" stroke="#34495E" stroke-width="0.3"/>
  <circle cx="46.4" cy="8.8" r="0.6" fill="black"/>
  <circle cx="46.6" cy="8.5" r="0.2" fill="white"/>
  
  <!-- Tomi Text (subtle) -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#7F8C8D" font-weight="bold">TOMI</text>
</svg>