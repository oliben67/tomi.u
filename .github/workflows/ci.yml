# This workflow runs on every push and pull request, using Taskfile targets
# to lint, compile, and test both the tomc compiler and the VS Code extensions.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tomc:
    name: Lint, compile and test (tomc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tomc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tomc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint
        run: task tomc:lint

      - name: Compile
        run: task tomc:build:debug

      - name: Test
        run: task tomc:test

  vscode-extensions:
    name: Build and package VS Code extensions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: vscode-extensions/tomi-language-support/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('vscode-extensions/tomi-language-support/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build
        run: task vscode:build

      - name: Package (.vsix)
        run: task vscode:package

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extensions
          path: vscode-extensions/*.vsix

