
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tomc:
    name: Lint, compile and test (tomc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tomc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tomc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tomc/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint – rustfmt
        run: cargo +nightly fmt --check

      - name: Lint – Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

  vscode-extension:
    name: Compile TypeScript VSCode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extensions/tomi-language-support

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: vscode-extensions/tomi-language-support/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('vscode-extensions/tomi-language-support/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

