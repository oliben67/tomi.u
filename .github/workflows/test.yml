name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tomc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tomc/**/Cargo.toml', 'tomc/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run all tests
        working-directory: tomc
        run: cargo test --workspace
